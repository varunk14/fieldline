[project]
name = "fieldline"
version = "0.1.0"
description = "Voice copilot for HVAC field technicians, built on sub-10ms retrieval."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pdfplumber==0.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fieldline = ["py.typed"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
